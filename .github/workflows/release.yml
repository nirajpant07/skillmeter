name: release

# Cross-OS NativeAOT compilation is not supported, so each RID must be built on a
# runner of that OS and architecture. That constraint is what shapes this file:
# six build jobs producing six artifacts, then one job that collects them.
#
# Registry publishing (npm, NuGet) is deliberately NOT here yet. Those pushes are
# effectively irreversible — NuGet has no delete, only unlisting, and npm's
# unpublish window is narrow — so the matrix gets proven against GitHub Releases,
# which can be deleted and redone freely, before any credential is wired up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.0.1-alpha.1). Treat any version used for a rehearsal as burned.'
        required: true
        default: '0.0.1-alpha.1'
      dry_run:
        description: 'Build and archive only — do not create a GitHub Release.'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
          # macos-13 was retired; the job queued for 9+ hours instead of failing,
          # because GitHub parks a job with no matching runner label until its 24h
          # limit rather than erroring. macos-15-intel is the current x86_64 image
          # (verified: uname -m = x86_64). If osx-x64 ever queues indefinitely
          # again, that label has been retired too — probe candidates with a
          # throwaway matrix of `runs-on` labels rather than guessing.
          - { rid: osx-x64,     os: macos-15-intel }
          # Left as the moving alias deliberately: there is no "-intel"-style alias
          # to pin against for arm64, and a pinned image is what broke above.
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT on Linux links against clang and zlib. The Windows runners carry
      # the MSVC linker via the Desktop C++ workload; macOS uses the Xcode CLT.
      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v for ${{ matrix.rid }}"

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/SkillMeter/SkillMeter.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ steps.v.outputs.version }} \
            -o out/${{ matrix.rid }}

      - name: Verify the binary actually runs
        shell: bash
        run: |
          set -euo pipefail
          exe="out/${{ matrix.rid }}/skillmeter"
          [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"

          # An arm64 binary cross-built on an arm64 runner is native, so it must run.
          "$exe" --help > /dev/null

          # The binary must report the version it was stamped with. This caught a
          # real defect: Program.Version was a hardcoded const, so -p:Version moved
          # the assembly metadata while the binary kept reporting the checked-in
          # number, including in the toolVersion field of the JSON contract.
          got="$("$exe" --version)"
          want="${{ steps.v.outputs.version }}"
          if [ "$got" != "$want" ]; then
            echo "FAIL: binary reports '$got', expected '$want'"
            exit 1
          fi
          echo "ok: binary reports $got"

          mkdir -p _smoke/alpha
          printf -- '---\nname: alpha\ndescription: d\n---\nbody\n' > _smoke/alpha/SKILL.md
          "$exe" _smoke --json

          ls -l "$exe"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          v=${{ steps.v.outputs.version }}
          name="skillmeter-$v-${{ matrix.rid }}"
          mkdir -p dist
          cp README.md LICENSE "out/${{ matrix.rid }}/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "out/${{ matrix.rid }}" && 7z a -tzip "../../dist/$name.zip" skillmeter.exe README.md LICENSE)
          else
            tar -czf "dist/$name.tar.gz" -C "out/${{ matrix.rid }}" skillmeter README.md LICENSE
          fi
          ls -l dist

      # The RID-specific dotnet tool package. The pointer package's
      # DotnetToolSettings.xml maps each RID to `skillmeter.<rid>`, so these must
      # exist or `dotnet tool install` resolves to nothing. Built here because it
      # AOT-compiles, and cross-OS AOT is unsupported.
      - name: Pack dotnet tool (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/SkillMeter/SkillMeter.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ steps.v.outputs.version }} \
            -o nupkg
          ls -l nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: skillmeter-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.rid }}
          path: nupkg/*.nupkg
          if-no-files-found: error

  release:
    name: collect + release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Scoped to the binary archives. The nupkg-* artifacts are consumed by the
      # nuget job and must not land in the GitHub Release, nor be counted here.
      - uses: actions/download-artifact@v4
        with:
          pattern: skillmeter-*
          path: staging
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          ls -l
          # Six archives, no more and no less — a missing RID must not slip through.
          count=$(ls | wc -l)
          if [ "$count" -ne 6 ]; then echo "expected 6 archives, found $count"; exit 1; fi
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${{ inputs.version }}"
          fi

          # Only a semver prerelease is flagged as one; v0.1.0 must land as a full
          # release or it stays hidden behind "show pre-releases".
          case "$tag" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac

          # Re-running a version must not hard-fail. Registry publishing can need a
          # second attempt, and the GitHub Release is the recoverable part.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists — replacing its assets"
            gh release upload "$tag" staging/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" staging/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              $PRE
          fi

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: bash
        run: |
          echo "Dry run: six binaries built and archived, no release created." >> "$GITHUB_STEP_SUMMARY"
          ls -l staging >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Registry publishing.
  #
  # Both registries are effectively write-once: NuGet cannot delete a published
  # package (only unlist it) and npm's unpublish window is narrow and blocked once
  # anything depends on you. A botched version number is therefore burned forever
  # on both. Every step below runs --dry-run unless this is a real tag push or the
  # operator explicitly set dry_run=false.
  # --------------------------------------------------------------------------

  publish-npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          pattern: skillmeter-*
          path: staging
          merge-multiple: true

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Six platform packages, each carrying one binary and declaring the os/cpu it
      # is for. npm installs exactly the matching one and skips the rest; the
      # wrapper in npm/skillmeter then execs whichever landed.
      - name: Build platform packages
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          mkdir -p npm-build

          emit () { # rid os cpu exe archive
            rid=$1; os=$2; cpu=$3; exe=$4; ar=$5
            dir="npm-build/skillmeter-$os-$cpu"
            mkdir -p "$dir/bin"

            case "$ar" in
              *.tar.gz) tar -xzf "staging/$ar" -C "$dir/bin" "$exe" ;;
              *.zip)    unzip -o -j "staging/$ar" "$exe" -d "$dir/bin" >/dev/null ;;
            esac
            # tar preserves the executable bit; the zip path has no bit to preserve.
            chmod +x "$dir/bin/$exe" 2>/dev/null || true

            node -e '
              const [dir,name,ver,os,cpu] = process.argv.slice(1);
              require("fs").writeFileSync(dir + "/package.json", JSON.stringify({
                name, version: ver,
                description: `skillmeter native binary for ${os}-${cpu}.`,
                license: "MIT",
                repository: { type: "git", url: "git+https://github.com/nirajpant07/skillmeter.git" },
                homepage: "https://github.com/nirajpant07/skillmeter#readme",
                os: [os], cpu: [cpu], files: ["bin/"],
                preferUnplugged: true
              }, null, 2) + "\n");
            ' "$dir" "skillmeter-$os-$cpu" "$V" "$os" "$cpu"

            cp README.md LICENSE "$dir/" 2>/dev/null || true
            echo "built skillmeter-$os-$cpu"
          }

          emit linux-x64   linux  x64   skillmeter     "skillmeter-$V-linux-x64.tar.gz"
          emit linux-arm64 linux  arm64 skillmeter     "skillmeter-$V-linux-arm64.tar.gz"
          emit osx-x64     darwin x64   skillmeter     "skillmeter-$V-osx-x64.tar.gz"
          emit osx-arm64   darwin arm64 skillmeter     "skillmeter-$V-osx-arm64.tar.gz"
          emit win-x64     win32  x64   skillmeter.exe "skillmeter-$V-win-x64.zip"
          emit win-arm64   win32  arm64 skillmeter.exe "skillmeter-$V-win-arm64.zip"

          # The wrapper's version and its optionalDependencies must all match the
          # release, or npm resolves a platform package that was never published.
          cp -r npm/skillmeter npm-build/skillmeter
          node -e '
            const fs = require("fs"), p = "npm-build/skillmeter/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            for (const k of Object.keys(j.optionalDependencies)) j.optionalDependencies[k] = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$V"
          cp README.md npm-build/skillmeter/

          find npm-build -name package.json -maxdepth 2 -exec sh -c 'echo "--- {}"; cat {}' \;

      # Read-only credential check, run before any publish. Catches the common
      # failures — wrong token type, expired token, granular token that does not
      # cover these names — while they are still free to fix.
      - name: Preflight — npm credential
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! who=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: $who"
            echo "Use an Automation token, or a Granular token with read+write covering skillmeter and skillmeter-*."
            exit 1
          fi
          echo "authenticated to npm as: $who"

          # Publishing over an existing version is impossible on npm, and the error
          # arrives after some packages have already gone up. Check first.
          V="${{ steps.v.outputs.version }}"
          for p in skillmeter skillmeter-linux-x64 skillmeter-linux-arm64 \
                   skillmeter-darwin-x64 skillmeter-darwin-arm64 \
                   skillmeter-win32-x64 skillmeter-win32-arm64; do
            if npm view "$p@$V" version >/dev/null 2>&1; then
              echo "::error::$p@$V is already published. Versions cannot be reused on npm; pick a new one."
              exit 1
            fi
          done
          echo "all 7 package names are free at version $V"

      # Platform packages go FIRST. The wrapper pins them by exact version, so
      # publishing it first leaves a window where installs resolve nothing.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REAL: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"

          # A semver prerelease must NOT become the `latest` dist-tag. npm defaults
          # to latest regardless of the version string, so publishing 0.0.1-alpha.1
          # unguarded would make a rehearsal build the thing `npx skillmeter`
          # installs for everyone. NuGet infers prerelease from semver by itself;
          # npm does not.
          case "$V" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "publishing $V under dist-tag: $TAG"

          # --provenance only on a real publish: it performs an OIDC exchange with
          # the registry, which has nothing to talk to under --dry-run.
          if [ "$REAL" = "true" ]; then
            FLAGS="--access public --provenance --tag $TAG"
          else
            FLAGS="--access public --dry-run --tag $TAG"
            echo "DRY RUN — nothing will be published"
          fi

          explain_failure () {
            echo "::error::npm publish failed for $1 after retries."
            cat <<'EOF'
          Read the npm error above; the two that actually occur are:

          "Two-factor authentication ... required to publish"
            The token authenticates but may not publish. Use a Classic "Automation"
            token (npmjs.com -> Access Tokens -> Generate New Token -> Classic ->
            Automation), or a Granular token with 2FA bypass enabled.

          "Package name triggered spam detection"
            npm's abuse filter, usually from publishing several brand-new
            similarly-named packages in quick succession. This step already spaces
            and retries them. If it persists for the same name, the durable fix is
            scoped names (@owner/skillmeter-<os>-<cpu>), which is why esbuild and
            swc publish their platform binaries scoped.
          EOF
            exit 1
          }

          # Publishing is resumable. A version cannot be republished on npm, so a
          # run that got partway through must skip what already landed rather than
          # failing on it — otherwise a partial publish can never be completed.
          publish_one () {
            dir=$1; name=$2
            if [ "$REAL" = "true" ] && npm view "$name@$V" version >/dev/null 2>&1; then
              echo "already published: $name@$V — skipping"
              return 0
            fi
            for attempt in 1 2 3; do
              if (cd "$dir" && npm publish $FLAGS); then return 0; fi
              if [ "$attempt" -lt 3 ]; then
                back=$((attempt * 45))
                echo "attempt $attempt failed; waiting ${back}s before retry"
                sleep "$back"
              fi
            done
            explain_failure "$name"
          }

          first=1
          for d in npm-build/skillmeter-*; do
            name=$(basename "$d")
            # Space out brand-new package creations; bursts are what trips the
            # abuse filter in the first place.
            if [ "$first" = 0 ] && [ "$REAL" = "true" ]; then sleep 20; fi
            first=0
            echo "::group::publish $name"
            publish_one "$d" "$name"
            echo "::endgroup::"
          done

          # Wrapper last: it pins the platform packages by exact version, so it must
          # never exist before they do.
          echo "::group::publish wrapper"
          [ "$REAL" = "true" ] && sleep 20
          publish_one npm-build/skillmeter skillmeter
          echo "::endgroup::"

  publish-nuget:
    name: nuget
    # Deliberately after npm rather than beside it. Both are write-once, but npm's
    # unpublish window gives a few hours of recourse and NuGet gives none — so the
    # unrecoverable registry goes last, once npm has proven the version is good.
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          path: staging
          merge-multiple: true

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The RID-agnostic pointer package. Contains no binary — only the
      # DotnetToolSettings.xml mapping each RID to its skillmeter.<rid> package —
      # so it needs no AOT toolchain and is built here rather than on the matrix.
      - name: Pack pointer package
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/SkillMeter/SkillMeter.csproj \
            -c Release -p:Version=${{ steps.v.outputs.version }} -o staging

          echo "packages to push:"; ls -l staging
          count=$(ls staging/*.nupkg | wc -l)
          # 6 RID packages + 1 pointer. Pushing a partial set leaves the pointer
          # resolving to packages that do not exist, which is worse than not
          # publishing at all — and on NuGet it cannot be undone.
          if [ "$count" -ne 7 ]; then echo "::error::expected 7 nupkg, found $count"; exit 1; fi

      - name: Preflight — API key and version availability
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # NuGet cannot delete or overwrite a published version, so a collision has
          # to be caught before the first push rather than partway through the seven.
          V="${{ steps.v.outputs.version }}"
          for id in skillmeter skillmeter.win-x64 skillmeter.win-arm64 \
                    skillmeter.linux-x64 skillmeter.linux-arm64 \
                    skillmeter.osx-x64 skillmeter.osx-arm64; do
            lower=$(echo "$id" | tr 'A-Z' 'a-z')
            url="https://api.nuget.org/v3-flatcontainer/$lower/index.json"
            if curl -sf "$url" -o /tmp/v.json 2>/dev/null; then
              if grep -qi "\"$V\"" /tmp/v.json; then
                echo "::error::$id $V is already on nuget.org. Versions are permanent; pick a new one."
                exit 1
              fi
            fi
          done
          echo "all 7 package ids are free at version $V"

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          REAL: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REAL" != "true" ]; then
            echo "DRY RUN — validating packages only, nothing will be pushed."
            for p in staging/*.nupkg; do
              unzip -l "$p" | head -20
              echo "--- $p OK"
            done
            exit 0
          fi

          V="${{ steps.v.outputs.version }}"
          SRC=https://api.nuget.org/v3/index.json

          # RID packages first, pointer LAST. The pointer is inert on its own, but a
          # pointer published without its targets is a broken install that NuGet
          # cannot delete. This ordering means an API key whose glob covers
          # `skillmeter` but not `skillmeter.win-x64` fails on the first RID package,
          # before anything user-visible exists.
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "::group::push skillmeter.$rid"
            dotnet nuget push "staging/skillmeter.$rid.$V.nupkg" \
              --api-key "$NUGET_API_KEY" --source "$SRC" --skip-duplicate
            echo "::endgroup::"
          done

          echo "::group::push pointer skillmeter"
          dotnet nuget push "staging/skillmeter.$V.nupkg" \
            --api-key "$NUGET_API_KEY" --source "$SRC" --skip-duplicate
          echo "::endgroup::"
