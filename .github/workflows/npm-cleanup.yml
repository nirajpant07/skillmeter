# TEMPORARY. Removes the four unscoped platform packages left behind by the
# partial publish at 0.0.1-alpha.7, before the switch to scoped names. npm allows
# unpublishing within 72 hours when nothing depends on the package; none of these
# were ever referenced, because the wrapper that would have pinned them never
# published. Delete this workflow once it has run.
name: npm-cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UNPUBLISH to proceed. Anything else lists only.'
        required: true
        default: 'list-only'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish orphaned unscoped packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -uo pipefail
          V=0.0.1-alpha.7
          ORPHANS="skillmeter-linux-x64 skillmeter-linux-arm64 skillmeter-darwin-x64 skillmeter-darwin-arm64"

          # Never touch the scoped packages or the wrapper: those are the live
          # release. This loop is hard-coded to the four unscoped orphans, and each
          # is re-checked against that list before anything destructive happens.
          for p in $ORPHANS; do
            case "$p" in
              skillmeter-linux-x64|skillmeter-linux-arm64|skillmeter-darwin-x64|skillmeter-darwin-arm64) ;;
              *) echo "refusing to touch unexpected package $p"; exit 1 ;;
            esac

            if ! npm view "$p@$V" version >/dev/null 2>&1; then
              echo "  $p@$V — not present, nothing to do"
              continue
            fi

            if [ "$CONFIRM" != "UNPUBLISH" ]; then
              echo "  $p@$V — present (would unpublish; re-run with confirm=UNPUBLISH)"
              continue
            fi

            echo "::group::unpublish $p@$V"
            if npm unpublish "$p@$V" --force; then
              echo "  removed $p@$V"
            else
              echo "::warning::could not unpublish $p@$V — deprecating instead"
              npm deprecate "$p@$V" "Orphaned build artifact; use the scoped @niraj.pant/* packages via the skillmeter wrapper." || true
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "final state:"
          for p in $ORPHANS; do
            if npm view "$p@$V" version >/dev/null 2>&1; then echo "  STILL PRESENT: $p@$V"; else echo "  gone: $p@$V"; fi
          done
