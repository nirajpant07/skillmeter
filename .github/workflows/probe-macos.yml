# TEMPORARY probe. Determines which macOS runner labels actually schedule, because
# an invalid label queues indefinitely rather than failing fast. Delete once the
# release matrix has a working osx-x64 runner.
name: probe-macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        label: [macos-13, macos-15-intel, macos-14, macos-15, macos-latest]
    steps:
      - name: Identify
        run: |
          echo "label=${{ matrix.label }}"
          echo "arch=$(uname -m)"
          sw_vers || true
